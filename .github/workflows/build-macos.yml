name: Build AirCard Wallet Tool

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "release/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run Wallet tool tests
        run: |
          python3 -m unittest tests.test_read_file tests.test_wallet_scanner
          python3 tests/verify_scanner_only.py
          python3 -m py_compile wallet_scanner.py apply_card_skin.py card_assets.py

      - name: Build universal macOS app and DMG
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Save release files
        run: |
          mkdir -p release
          cp build/AirCard-Wallet-Tool.dmg release/AirCard-Wallet-Tool.dmg
          shasum -a 256 release/AirCard-Wallet-Tool.dmg > release/AirCard-Wallet-Tool.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AirCard-Wallet-Tool-macOS
          path: |
            release/AirCard-Wallet-Tool.dmg
            release/AirCard-Wallet-Tool.dmg.sha256

      - name: Commit DMG to release directory
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/AirCard-Wallet-Tool.dmg release/AirCard-Wallet-Tool.dmg.sha256
          git diff --cached --quiet || git commit -m "Add AirCard Wallet Tool DMG [skip ci]"
          git push

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AirCard Wallet Tool v1.0.0
          target_commitish: main
          body: |
            ## English
            macOS tool for scanning Wallet card hashes, editing card names, batch importing hashes, previewing artwork, and applying custom card covers.

            After writing a cover, completely quit and reopen Wallet on the iPhone.

            ## 中文
            macOS 钱包卡片工具，支持扫描卡片 Hash、修改卡片名称、批量导入 Hash、拖拽预览图片以及写入自定义卡片封面。

            写入封面完成后，请在 iPhone 上完全退出并重新打开钱包 App。
          files: |
            release/AirCard-Wallet-Tool.dmg
            release/AirCard-Wallet-Tool.dmg.sha256
